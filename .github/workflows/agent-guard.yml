name: MIB — détection de secrets (Agent Guard)

# Analyse le dépôt à chaque envoi et à chaque pull request :
# si une clé API, un mot de passe ou un jeton est repéré, le contrôle échoue.
# Agent Guard s'appuie sur gitleaks ; tout se passe dans GitHub, rien à installer.
# Version épinglée (v3.6.9) : la mettre à jour par une pull request relue.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-guard:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JeongJaeSoon/agent-guard@v3.6.9
        with:
          paths: "."
          gitleaks-version: "8.30.1"
          gitleaks-checksum: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
